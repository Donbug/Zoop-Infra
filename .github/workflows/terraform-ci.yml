name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Validate (${{ matrix.component }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: bootstrap
            directory: terraform/bootstrap
          - component: dev
            directory: terraform/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Show Terraform version
        run: terraform version

      - name: Check formatting
        run: terraform fmt -check -recursive "${{ matrix.directory }}"

      - name: Initialize without backend
        run: terraform -chdir="${{ matrix.directory }}" init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir="${{ matrix.directory }}" validate -no-color